packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@parcel/watcher': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  fast-uri: '>=3.1.5'
  postcss: 8.5.23
  sharp: 0.35.3
  brace-expansion: 5.0.9
  'brace-expansion@1': '>=1.1.18'
  js-yaml: '>=4.3.1'
  'js-yaml@3': '>=3.15.1'
  nanoid: '>=3.3.17'
  'nanoid@3': '>=3.3.17'
  deepmerge-ts: ^8.0.0
