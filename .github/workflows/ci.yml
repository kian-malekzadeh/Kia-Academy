name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI-1 (supply chain): every third-party action is pinned to an immutable
# commit SHA (not a mutable tag) so a compromised action repo cannot push new
# code into this pipeline. Top-level permissions default-deny; jobs elevate
# individually only when needed.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kia_academy
          POSTGRES_PASSWORD: kia_academy
          POSTGRES_DB: kia_academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kia_academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kia_academy:kia_academy@localhost:5432/kia_academy?schema=public

    steps:
      # v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v4.1.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0

      # v4.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `--ignore-scripts` skips the root postinstall that normally generates
      # the Prisma client (git-ignored, custom output at apps/api/src/generated).
      # Generate it explicitly before lint/typecheck/build steps.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @kia-academy/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build