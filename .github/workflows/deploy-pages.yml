name: Deploy GitHub Pages

# Builds the in-browser demo app (NEXT_PUBLIC_DEMO_MODE=true) and publishes it to
# GitHub Pages. Requires Settings → Pages → Source = "GitHub Actions", which this
# workflow enables itself on first run (actions/configure-pages enablement).
#
# CI-1 (supply chain): every third-party action is pinned to an immutable
# commit SHA (not a mutable tag) so a compromised action repo cannot push new
# code into this deploy pipeline. Permissions are scoped per job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        # actions/checkout v4.3.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0

      - name: Setup Node
        # actions/setup-node v4.2.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build static demo export
        run: pnpm build:pages

      - name: Bypass Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Configure Pages (enables the site on first run)
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      - name: Upload artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
