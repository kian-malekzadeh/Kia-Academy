name: Docker Publish

# Builds and publishes the hardened api/web images to GHCR on every push to
# main and on version tags (v*). Deploy servers then `docker pull` + restart —
# no image building on the production host (see docs/DEPLOY_RUNBOOK.md §8).
#
# Tags pushed per image:
#   main  /  sha-<commit>   (branch pushes)
#   1.2.3  /  sha-<commit>  (v* tags)
# Retention: older sha- images can be pruned via the GHCR UI or a scheduled
# cleanup action.

on:
  push:
    branches: [main]
    tags: ["v*"]

# CI-1 (supply chain): SHA-pinned actions, minimal per-job permissions.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    steps:
      # v4.3.1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compute image tags
        id: tags
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${GITHUB_REF#refs/heads/}"
          fi
          {
            echo "version=${VERSION}"
            echo "api_image=${REPO}/api"
            echo "web_image=${REPO}/web"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.10.0
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2edaedfc5b8f7fa5cbe1

      - name: Log in to GHCR
        # docker/login-action v3.4.0
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        # docker/build-push-action v6.18.0
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.api_image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ steps.tags.outputs.web_image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.web_image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
